<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İstem</title>

<link rel="stylesheet" href="styles.css">
<!-- Tema/mod/yoğunluk tercihi ilk boyamadan ÖNCE uygulansın diye senkron (bkz. tema.js). -->
<script src="tema.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4d47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İstem">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>

<!-- BOOT: client.auth.getSession() sonuçlanana kadar tek görünen şey bu —
     ne giriş formu (boş dropdown flaşı) ne de eski/doğrulanmamış bir
     localStorage işaretiyle doğrudan uygulama gösterilir. -->
<div class="authoverlay" id="authOverlay">
  <div class="authcard" id="bootLoadCard">
    <div class="wordmark" style="justify-content:center"><img class="logo-img" src="icons/selcuk-logo.png" alt="Selçuk Üniversitesi"><span class="logo">İstem</span><span class="beta">PATOLOJİ</span></div>
    <p style="text-align:center;color:var(--ink-3);font-size:13px;padding:18px 0 4px">Yükleniyor…</p>
  </div>

  <!-- GİRİŞ EKRANI (ad seç + PIN) -->
  <div class="authcard hidden" id="authCard">
    <div class="wordmark"><img class="logo-img" src="icons/selcuk-logo.png" alt="Selçuk Üniversitesi"><span class="logo">İstem</span><span class="beta">PATOLOJİ</span></div>
    <p class="m-label">Kullanıcı</p>
    <select id="authUser"></select>
    <p class="m-label">PIN</p>
    <input id="authPin" class="pinmask" type="text" inputmode="numeric" autocomplete="off" name="fld_7k2q" placeholder="••••" maxlength="6">
    <div class="err" id="authErr"></div>
    <button class="btn-primary" id="authSubmit" style="width:100%">Giriş yap</button>
  </div>
</div>

<!-- UYGULAMA -->
<div class="app hidden" id="appRoot">
  <div class="shell">

    <!-- SIDEBAR -->
    <aside class="side">
      <div class="wordmark"><img class="logo-img" src="icons/selcuk-logo.png" alt="Selçuk Üniversitesi"><span class="logo">İstem</span><span class="beta">PATOLOJİ</span></div>
      <button class="new" id="newBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg> <span class="lbl">Yeni İstek</span></button>
      <nav class="nav" id="nav">
        <a class="on" data-page="kuyruk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg> <span class="lbl">İş Kuyruğu</span></a>
        <a data-page="setler"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> <span class="lbl">İstek Setleri</span></a>
        <a data-page="sablonlar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v4H4zM4 10h10v10H4zM17 10h3v10h-3z"/></svg> <span class="lbl">Şablonlar</span></a>
        <a data-page="cihazlar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg> <span class="lbl">Cihazlar</span></a>
        <a data-page="hizmetler"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg> <span class="lbl">Hizmetler</span></a>
        <div class="navsec" data-admin>Yönetim</div>
        <a data-page="istatistikler" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg> <span class="lbl">İstatistikler</span></a>
        <a data-page="kullanicilar" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span class="lbl">Kullanıcılar</span></a>
        <a data-page="test-gruplari" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41L13.42 20.58a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg> <span class="lbl">Test Grupları</span></a>
        <a data-page="test-katalogu" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> <span class="lbl">Test Kataloğu</span></a>
        <a data-page="yedekler" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg> <span class="lbl">Yedekler</span></a>
      </nav>
      <div class="spacer"></div>
      <button class="side-daralt" id="sideDaraltBtn" type="button" title="Menüyü daralt"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="lbl">Daralt</span></button>
      <div class="sideuser">
        <button class="me" id="meBtn" title="Görünüm ayarları" aria-haspopup="true" aria-expanded="false">
          <div class="av" id="meAv">--</div>
          <div style="min-width:0"><div class="nm" id="meName">—</div><div class="rl" id="meRole">—</div></div>
        </button>
        <div class="prefs" id="prefsPanel" role="dialog" aria-label="Görünüm ayarları"></div>
        <button class="gear" id="logoutBtn" title="Çıkış yap"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </aside>

    <!-- MAIN (route'a göre app.js dolduruyor) -->
    <main class="main" id="mainView"></main>

    <!-- RIGHT RAIL -->
    <aside class="rail" id="rail"></aside>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="yeni-bildirim" id="yeniBildirim" role="status" aria-live="polite" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  <span id="yeniBildirimMetin"></span>
  <button class="btn-primary btn-sm" id="yeniBildirimGoster" type="button">Göster</button>
  <button class="ub-x" id="yeniBildirimKapat" type="button" title="Kapat" aria-label="Bildirimi kapat">×</button>
</div>
<!-- Çalışma Listesi — ekranda görünmez, yalnız yazdırırken (styles.css @media print) -->
<div class="yazdir-alani" id="yazdirAlani"></div>
<div class="update-banner" id="updateBanner">
  <span>Yeni sürüm mevcut</span>
  <button class="btn-primary btn-sm" id="updateBannerBtn">Yenile</button>
  <button class="ub-x" id="updateBannerClose" title="Kapat">×</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script src="ocr.js"></script>
</body>
</html>
